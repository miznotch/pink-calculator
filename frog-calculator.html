<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Frog Calculator</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #fff0f5;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    font-family: 'Nunito', sans-serif;
  }
  .calc-wrapper {
    position: relative;
    width: 400px;
    height: 400px;
    flex-shrink: 0;
  }
  .calc-bg {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    object-fit: fill;
    pointer-events: none;
    z-index: 0;
  }
  .expression {
    position: absolute;
    top: 18%;
    left: 14%;
    width: 68%;
    font-size: 0.55rem;
    color: #b08070;
    font-weight: 700;
    text-align: center;
    z-index: 3;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .display {
    position: absolute;
    top: 21%;
    left: 13%;
    width: 73%;
    height: 10%;
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 3;
  }
  .display-text {
    font-weight: 900;
    font-size: 1.6rem;
    color: #4a2a2a;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .btn {
    position: absolute;
    background: transparent;
    border: none;
    cursor: pointer;
    border-radius: 10px;
    font-family: 'Nunito', sans-serif;
    font-weight: 900;
    font-size: 1.1rem;
    font-variant-numeric: tabular-nums;
    color: #4a3030;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: transform 0.08s ease, filter 0.08s ease;
    outline: none;
    -webkit-tap-highlight-color: transparent;
    z-index: 3;
    width: 9.5%;
    height: 10%;
  }
  .btn:active { transform: scale(0.82); filter: brightness(0.85); }
  .btn.op   { color: #7a4a20; font-size: 1.1rem; }
  .btn.eq   { color: #7a4a20; font-size: 1.2rem; }
  .btn.util { color: #c05070; font-size: 1.2rem; font-weight: 900; }
  .btn.deco { color: #e8a0b0; font-size: 1.4rem; cursor: default; }
</style>
</head>
<body>
<div class="calc-wrapper">
  <img class="calc-bg" src="frog-calculator-bg.png" alt="" />

  <div class="expression" id="expression"></div>
  <div class="display"><span class="display-text" id="display">0</span></div>

  <!-- Row 1: 7 8 9 + -->
  <button class="btn"    style="left:25.7%;top:36.3%" onclick="input('7')">7</button>
  <button class="btn"    style="left:38.8%;top:36.5%" onclick="input('8')">8</button>
  <button class="btn"    style="left:52.0%;top:36.3%" onclick="input('9')">9</button>
  <button class="btn op" style="left:64.85%;top:36.0%" onclick="inputOp('+')">+</button>

  <!-- Row 2: 4 5 6 × -->
  <button class="btn"    style="left:25.7%;top:47.9%" onclick="input('4')">4</button>
  <button class="btn"    style="left:38.8%;top:47.9%" onclick="input('5')">5</button>
  <button class="btn"    style="left:52.05%;top:48.1%" onclick="input('6')">6</button>
  <button class="btn op" style="left:64.85%;top:47.3%" onclick="inputOp('×')">×</button>

  <!-- Row 3: 1 2 3 − -->
  <button class="btn"    style="left:25.7%;top:59.2%" onclick="input('1')">1</button>
  <button class="btn"    style="left:38.8%;top:59.4%" onclick="input('2')">2</button>
  <button class="btn"    style="left:52.0%;top:59.4%" onclick="input('3')">3</button>
  <button class="btn op" style="left:64.85%;top:58.5%" onclick="inputOp('−')">−</button>

  <!-- Row 4: ♡ 0 . ÷ -->
  <button class="btn deco" style="left:25.2%;top:70.5%">♡</button>
  <button class="btn"      style="left:38.8%;top:70.5%" onclick="input('0')">0</button>
  <button class="btn"      style="left:52.5%;top:70.5%" onclick="input('.')">.</button>
  <button class="btn op"   style="left:64.85%;top:69.8%" onclick="inputOp('÷')">÷</button>

  <!-- Row 5: AC ⌫ = -->
  <button class="btn util" style="left:27.45%;top:81.05%;font-size:0.9rem" onclick="clearAll()">AC</button>
  <button class="btn util" style="left:47.25%;top:81.05%" onclick="backspace()">⌫</button>
  <button class="btn eq"   style="left:65.05%;top:81.55%" onclick="calculate()">=</button>
</div>

<script>
  let currentVal = '0';
  let expression = '';
  let justCalc = false;

  const disp = document.getElementById('display');
  const expr = document.getElementById('expression');

  function updateDisplay() {
    const len = currentVal.length;
    disp.style.fontSize = len > 10 ? '0.85rem' : len > 7 ? '1.2rem' : '1.6rem';
    disp.textContent = len > 13 ? parseFloat(currentVal).toExponential(4) : currentVal;
  }

  function input(val) {
    if (justCalc && val !== '.') { currentVal = ''; expression = ''; justCalc = false; }
    if (val === '.') {
      if (currentVal.includes('.')) return;
      if (currentVal === '' || currentVal === '0') currentVal = '0';
    }
    if (currentVal === '0' && val !== '.') currentVal = '';
    currentVal += val;
    updateDisplay();
  }

  function inputOp(op) {
    justCalc = false;
    if (currentVal !== '' && currentVal !== '0') {
      expression += currentVal + ' ' + op + ' ';
      currentVal = '0';
    } else if (expression !== '') {
      expression = expression.trimEnd().replace(/\S+$/, op) + ' ';
    }
    expr.textContent = expression;
    updateDisplay();
  }

  function calculate() {
    if (expression === '') return;
    const full = expression + (currentVal && currentVal !== '0' ? currentVal : '');
    expr.textContent = full + ' =';
    try {
      const safe = full.replace(/×/g,'*').replace(/÷/g,'/').replace(/−/g,'-');
      let result = Function('"use strict";return(' + safe + ')')();
      result = parseFloat(result.toFixed(10));
      currentVal = String(result);
      expression = '';
      justCalc = true;
      updateDisplay();
    } catch(e) { disp.textContent = 'Error'; }
  }

  function clearAll() {
    currentVal = '0'; expression = ''; justCalc = false;
    expr.textContent = ''; updateDisplay();
  }

  function backspace() {
    if (justCalc) { clearAll(); return; }
    currentVal = currentVal.slice(0,-1);
    if (!currentVal || currentVal === '-') currentVal = '0';
    updateDisplay();
  }

  document.addEventListener('keydown', e => {
    if ('0123456789.'.includes(e.key)) input(e.key);
    else if (e.key==='+') inputOp('+');
    else if (e.key==='-') inputOp('−');
    else if (e.key==='*') inputOp('×');
    else if (e.key==='/') { e.preventDefault(); inputOp('÷'); }
    else if (e.key==='Enter'||e.key==='=') calculate();
    else if (e.key==='Backspace') backspace();
    else if (e.key==='Escape') clearAll();
  });
</script>
</body>
</html>
