<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Frog Calculator</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #fff0f5;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    font-family: 'Nunito', sans-serif;
  }
  .calc-wrapper {
    position: relative;
    width: 400px;
    height: 400px;
    flex-shrink: 0;
  }
  .calc-bg {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    object-fit: fill;
    pointer-events: none;
    z-index: 0;
  }
  .screen {
    position: absolute;
    top: 18%;
    left: 13%;
    width: 73%;
    height: 15%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 2px;
    z-index: 1;
    overflow: hidden;
  }
  .expr-line {
    font-size: 14px;
    color: #8b7d7b;
    width: 100%;
    text-align: right;
    padding-right: 12px;
    height: 16px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .display-line {
    font-size: 28px;
    font-weight: 900;
    color: #4a3c31;
    width: 100%;
    text-align: right;
    padding-right: 10px;
    white-space: nowrap;
    overflow: hidden;
  }
  .btn-grid {
    position: absolute;
    top: 36%;
    left: 13%;
    width: 74%;
    height: 52%;
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    grid-template-rows: repeat(5, 1fr);
    gap: 8px;
    z-index: 1;
  }
  button {
    background: transparent;
    border: none;
    outline: none;
    cursor: pointer;
    border-radius: 50%;
    font-family: 'Nunito', sans-serif;
    font-size: 18px;
    font-weight: 800;
    color: transparent;
    display: flex;
    align-items: center;
    justify-content: center;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  button:active {
    transform: scale(0.92);
  }
</style>
</head>
<body>

<div class="calc-wrapper">
  <img class="calc-bg" src="frog-calc-bg.png" alt="Calculator Background">
  
  <div class="screen">
    <div id="expr" class="expr-line"></div>
    <div id="disp" class="display-line">0</div>
  </div>

  <div class="btn-grid">
    <button onclick="clearAll()">C</button>
    <button onclick="backspace()">⌫</button>
    <button onclick="inputOp('÷')">÷</button>
    <button onclick="inputOp('×')">×</button>
    
    <button onclick="input('7')">7</button>
    <button onclick="input('8')">8</button>
    <button onclick="input('9')">9</button>
    <button onclick="inputOp('−')">−</button>
    
    <button onclick="input('4')">4</button>
    <button onclick="input('5')">5</button>
    <button onclick="input('6')">6</button>
    <button onclick="inputOp('+')">+</button>
    
    <button onclick="input('1')">1</button>
    <button onclick="input('2')">2</button>
    <button onclick="input('3')">3</button>
    <button style="grid-row: span 2; height: 100%; border-radius: 20px;" onclick="calculate()">=</button>
    
    <button style="grid-column: span 2; width: 100%; border-radius: 20px;" onclick="input('0')">0</button>
    <button onclick="input('.')">.</button>
  </div>
</div>

<script>
  const disp = document.getElementById('disp');
  const expr = document.getElementById('expr');

  let currentVal = '0';
  let expression = '';
  let justCalc = false;

  function updateDisplay() {
    disp.textContent = currentVal;
  }

  function input(num) {
    if (justCalc) {
      currentVal = num === '.' ? '0.' : num;
      justCalc = false;
    } else {
      if (num === '.' && currentVal.includes('.')) return;
      if (currentVal === '0' && num !== '.') {
        currentVal = num;
      } else {
        currentVal += num;
      }
    }
    updateDisplay();
  }

  function inputOp(op) {
    if (justCalc) justCalc = false;
    
    if (currentVal !== '0' || expression === '') {
      expression += currentVal + ' ' + op + ' ';
      currentVal = '0';
    } else if (expression !== '') {
      expression = expression.trimEnd().replace(/\S+$/, op) + ' ';
    }
    expr.textContent = expression;
    updateDisplay();
  }

  function calculate() {
    if (expression === '') return;
    
    // Append the current active value to the queued expression
    const full = expression + (currentVal && currentVal !== '0' ? currentVal : '');
    expr.textContent = full + ' =';
    
    try {
      // Map safe operators for evaluation
      const safe = full.replace(/×/g,'*').replace(/÷/g,'/').replace(/−/g,'-');
      let result = Function('"use strict";return(' + safe + ')')();
      
      // Keep float precision clean
      result = parseFloat(result.toFixed(10));
      
      // Update variables so the next click handles a new input correctly
      currentVal = String(result);
      expression = '';
      justCalc = true;
      
      updateDisplay();
    } catch(e) { 
      disp.textContent = 'Error'; 
      expression = '';
      currentVal = '0';
    }
  }

  function clearAll() {
    currentVal = '0'; 
    expression = ''; 
    justCalc = false;
    expr.textContent = ''; 
    updateDisplay();
  }

  function backspace() {
    if (justCalc) { clearAll(); return; }
    currentVal = currentVal.slice(0,-1);
    if (!currentVal || currentVal === '-') currentVal = '0';
    updateDisplay();
  }

  document.addEventListener('keydown', e => {
    if ('0123456789.'.includes(e.key)) input(e.key);
    else if (e.key==='+') inputOp('+');
    else if (e.key==='-') inputOp('−');
    else if (e.key==='*') inputOp('×');
    else if (e.key==='/') inputOp('÷');
    else if (e.key==='Enter' || e.key==='=') { e.preventDefault(); calculate(); }
    else if (e.key==='Backspace') backspace();
    else if (e.key==='Escape') clearAll();
  });
</script>

</body>
</html>
