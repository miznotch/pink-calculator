<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Frog Calculator</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
<style>
  html { background: #ffffff; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #ffffff;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    font-family: 'Nunito', sans-serif;
  }
  .calc-wrapper {
    position: relative;
    width: 400px;
    height: 400px;
    flex-shrink: 0;
  }
  .calc-bg {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    object-fit: fill;
    pointer-events: none;
    z-index: 0;
  }
  .screen {
    position: absolute;
    top: 19.9%;
    left: 18.7%;
    width: 62.1%;
    height: 12.8%;
    height: 11%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 2px;
    z-index: 3;
    overflow: hidden;
  }
  .expression {
    font-size: 0.65rem;
    color: #7a4a3a;
    font-weight: 800;
    text-align: right;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    width: 100%;
    direction: rtl;
    padding-right: 3.75%;
  }
  .display-text {
    font-weight: 900;
    font-size: 1.6rem;
    color: #4a2a2a;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    width: 100%;
    text-align: center;
  }
  .btn {
    position: absolute;
    background: transparent;
    border: none;
    cursor: pointer;
    border-radius: 10px;
    font-family: 'Nunito', sans-serif;
    font-weight: 900;
    font-size: 1.1rem;
    font-variant-numeric: tabular-nums;
    color: #4a3030;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: transform 0.08s ease, filter 0.08s ease;
    outline: none;
    -webkit-tap-highlight-color: transparent;
    z-index: 3;
    width: 9.5%;
    height: 10%;
  }
  .btn:active { transform: scale(0.82); filter: brightness(0.85); }
  .btn.op   { color: #7a4a20; font-size: 1.1rem; }
  .btn.eq   { color: #7a4a20; font-size: 1.2rem; }
  .btn.util { color: #c05070; font-size: 1.2rem; font-weight: 900; }
  .btn.deco { color: #e8a0b0; font-size: 1.4rem; cursor: default; }
  .expr-wrap {
    margin: 10px auto 0;
    width: 63%;
  }
  .expr-label {
    font-size: 0.55rem;
    color: #d4a0b0;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    padding-left: 4px;
  }
  .expr-box {
    background: #fff8f0;
    border: 2px solid #f5c2cc;
    border-radius: 16px;
    padding: 10px 14px;
    font-family: 'Nunito', sans-serif;
    font-weight: 800;
    font-size: 0.8rem;
    color: #7a4a3a;
    box-shadow: 0 3px 10px rgba(240,150,170,0.2), inset 0 1px 3px rgba(255,255,255,0.8);
    white-space: normal;
    overflow-y: auto;
    word-break: break-all;
    text-align: right;
    min-height: 60px;
    max-height: 100px;
    width: 100%;
  }
  .expr-box.empty { color: #d4b0b8; font-style: italic; }
</style>
</head>

<div class="expr-wrap">
  <div class="expr-box empty" id="expression">—</div>
</div>

</div>

<script>
  let currentVal = '0';
  let expression = '';
  let justCalc = false;

  const disp = document.getElementById('display');
  const expr = document.getElementById('expression');

  function updateDisplay() {
    const len = currentVal.length;
    disp.style.fontSize = len > 10 ? '0.85rem' : len > 7 ? '1.2rem' : '1.6rem';
    disp.textContent = len > 13 ? parseFloat(currentVal).toExponential(4) : currentVal;
  }

  function input(val) {
    if (justCalc && val !== '.') { currentVal = ''; expression = ''; justCalc = false; }
    if (val === '.') {
      if (currentVal.includes('.')) return;
      if (currentVal === '' || currentVal === '0') currentVal = '0';
    }
    if (currentVal === '0' && val !== '.') currentVal = '';
    currentVal += val;
    updateDisplay();
  }

  function inputOp(op) {
    justCalc = false;
    if (currentVal !== '' && currentVal !== '0') {
      expression += currentVal + ' ' + op + ' ';
      currentVal = '0';
    } else if (expression !== '') {
      expression = expression.trimEnd().replace(/\S+$/, op) + ' ';
    }
    expr.textContent = expression || '—'; expr.classList.toggle('empty', !expression);
    updateDisplay();
  }

  function calculate() {
    if (expression === '') return;
    const full = expression + (currentVal && currentVal !== '0' ? currentVal : '');
    expr.textContent = full + ' ='; expr.classList.remove('empty');
    try {
      const safe = full.replace(/×/g,'*').replace(/÷/g,'/').replace(/−/g,'-');
      let result = Function('"use strict";return(' + safe + ')')();
      result = parseFloat(result.toFixed(10));
      currentVal = String(result);
      expression = '';
      justCalc = true;
      updateDisplay();
    } catch(e) { disp.textContent = 'Error'; }
  }

  function clearAll() {
    currentVal = '0'; expression = ''; justCalc = false;
    expr.textContent = '—'; expr.classList.add('empty'); updateDisplay();
  }

  function backspace() {
    if (justCalc) { clearAll(); return; }
    currentVal = currentVal.slice(0,-1);
    if (!currentVal || currentVal === '-') currentVal = '0';
    updateDisplay();
  }

  document.addEventListener('keydown', e => {
    if ('0123456789.'.includes(e.key)) input(e.key);
    else if (e.key==='+') inputOp('+');
    else if (e.key==='-') inputOp('−');
    else if (e.key==='*') inputOp('×');
    else if (e.key==='/') { e.preventDefault(); inputOp('÷'); }
    else if (e.key==='Enter'||e.key==='=') calculate();
    else if (e.key==='Backspace') backspace();
    else if (e.key==='Escape') clearAll();
  });
</script>
