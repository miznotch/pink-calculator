<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Frog Calculator</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #fff0f5;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    font-family: 'Nunito', sans-serif;
  }
  .calc-wrapper {
    position: relative;
    width: 400px;
    height: 400px;
    flex-shrink: 0;
  }
  .calc-bg {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    object-fit: fill;
    pointer-events: none;
    z-index: 0;
  }
  .screen {
    position: absolute;
    top: 18%;
    left: 14%;
    width: 71%;
    height: 15%;
    display: flex;
    flex-direction: column;
    align-items: flex-end; /* Align screen items to the right like a real calculator */
    justify-content: center;
    gap: 1px;
    z-index: 3;
    overflow: hidden;
    padding: 0 8px; /* Adds a small buffer so text doesn't touch the edges */
  }
  .expression {
    font-size: 0.7rem;
    color: #7a4a3a;
    font-weight: 800;
    text-align: right;
    white-space: nowrap;
    width: 100%;
    direction: ltr; /* Keeps math operators correctly ordered when overflowing */
    overflow: hidden;
  }
  .display-text {
    font-weight: 900;
    font-size: 1.4rem;
    color: #4a2a2a;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    width: 100%;
    text-align: right;
  }
  .btn {
    position: absolute;
    background: transparent;
    border: none;
    cursor: pointer;
    border-radius: 10px;
    font-family: 'Nunito', sans-serif;
    font-weight: 900;
    font-size: 1.1rem;
    font-variant-numeric: tabular-nums;
    color: #4a3030;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: transform 0.08s ease, filter 0.08s ease;
    outline: none;
    -webkit-tap-highlight-color: transparent;
    z-index: 3;
    width: 9.5%;
    height: 10%;
  }
  .btn:active { transform: scale(0.82); filter: brightness(0.85); }
  .btn.op   { color: #7a4a20; font-size: 1.1rem; }
  .btn.eq   { color: #7a4a20; font-size: 1.2rem; }
  .btn.util { color: #c05070; font-size: 1.2rem; font-weight: 900; }
  .btn.deco { color: #e8a0b0; font-size: 1.4rem; cursor: default; }
</style>
</head>

  </div>
  
  <button class="btn util" style="top:37.0%; left:12.5%;" onclick="clearAll()">C</button>
  <button class="btn util" style="top:37.0%; left:23.0%;" onclick="backspace()">⌫</button>
  <button class="btn deco" style="top:37.0%; left:33.5%;">✿</button>
  <button class="btn op"   style="top:37.0%; left:44.0%;" onclick="inputOp('÷')">÷</button>
  <button class="btn deco" style="top:37.0%; left:55.0%;">⭐</button>
  <button class="btn deco" style="top:37.0%; left:65.5%;">🌸</button>
  <button class="btn deco" style="top:37.0%; left:76.0%;">✨</button>

  <button class="btn"    style="top:50.0%; left:12.5%;" onclick="input('7')">7</button>
  <button class="btn"    style="top:50.0%; left:23.0%;" onclick="input('8')">8</button>
  <button class="btn"    style="top:50.0%; left:33.5%;" onclick="input('9')">9</button>
  <button class="btn op"   style="top:50.0%; left:44.0%;" onclick="inputOp('×')">×</button>
  <button class="btn deco" style="top:50.0%; left:55.0%;">🍀</button>
  <button class="btn deco" style="top:50.0%; left:65.5%;">🍓</button>
  <button class="btn deco" style="top:50.0%; left:76.0%;">🍄</button>

  <button class="btn"    style="top:63.0%; left:12.5%;" onclick="input('4')">4</button>
  <button class="btn"    style="top:63.0%; left:23.0%;" onclick="input('5')">5</button>
  <button class="btn"    style="top:63.0%; left:33.5%;" onclick="input('6')">6</button>
  <button class="btn op"   style="top:63.0%; left:44.0%;" onclick="inputOp('−')">−</button>
  <button class="btn deco" style="top:63.0%; left:55.0%;">🍦</button>
  <button class="btn deco" style="top:63.0%; left:65.5%;">🎀</button>
  <button class="btn deco" style="top:63.0%; left:76.0%;">🍭</button>

  <button class="btn"    style="top:76.0%; left:12.5%;" onclick="input('1')">1</button>
  <button class="btn"    style="top:76.0%; left:23.0%;" onclick="input('2')">2</button>
  <button class="btn"    style="top:76.0%; left:33.5%;" onclick="input('3')">3</button>
  <button class="btn op"   style="top:76.0%; left:44.0%;" onclick="inputOp('+')">+</button>
  <button class="btn deco" style="top:76.0%; left:55.0%;">🪐</button>
  <button class="btn deco" style="top:76.0%; left:65.5%;">🍩</button>
  <button class="btn deco" style="top:76.0%; left:76.0%;">🎈</button>

  <button class="btn"    style="top:88.5%; left:12.5%; width:20.0%;" onclick="input('0')">0</button>
  <button class="btn"    style="top:88.5%; left:33.5%;" onclick="input('.')">.</button>
  <button class="btn eq"   style="top:88.5%; left:44.0%;" onclick="calculate()">=</button>
  <button class="btn deco" style="top:88.5%; left:55.0%;">🧸</button>
  <button class="btn deco" style="top:88.5%; left:65.5%;">🐾</button>
  <button class="btn deco" style="top:88.5%; left:76.0%;">💌</button>
</div>

<script>
  const expr = document.getElementById('expr');
  const disp = document.getElementById('disp');

  let currentVal = '0';
  let expression = '';
  let justCalc = false;

  function updateDisplay() {
    disp.textContent = currentVal;
    // Automatically scrolls the expression view rightwards so the newest operations are always visible
    expr.scrollLeft = expr.scrollWidth; 
  }

  function input(num) {
    if (justCalc) {
      currentVal = num === '.' ? '0.' : num;
      justCalc = false;
    } else {
      if (num === '.' && currentVal.includes('.')) return;
      if (currentVal === '0' && num !== '.') {
        currentVal = num;
      } else {
        currentVal += num;
      }
    }
    updateDisplay();
  }

  function inputOp(op) {
    if (justCalc) {
      expression = currentVal + ' ' + op + ' ';
      justCalc = false;
      currentVal = '0';
    } else if (currentVal !== '0' || expression === '') {
      expression += currentVal + ' ' + op + ' ';
      currentVal = '0';
    } else if (expression !== '') {
      expression = expression.trimEnd().replace(/\S+$/, op) + ' ';
    }
    expr.textContent = expression;
    updateDisplay();
  }

  function calculate() {
    if (expression === '') return;
    const full = expression + (currentVal && currentVal !== '0' ? currentVal : '');
    expr.textContent = full + ' =';
    try {
      const safe = full.replace(/×/g,'*').replace(/÷/g,'/').replace(/−/g,'-');
      let result = Function('"use strict";return(' + safe + ')')();
      result = parseFloat(result.toFixed(10));
      currentVal = String(result);
      expression = '';
      justCalc = true;
      updateDisplay();
    } catch(e) { disp.textContent = 'Error'; }
  }

  function clearAll() {
    currentVal = '0'; expression = ''; justCalc = false;
    expr.textContent = ''; updateDisplay();
  }

  function backspace() {
    if (justCalc) { clearAll(); return; }
    currentVal = currentVal.slice(0,-1);
    if (!currentVal || currentVal === '-') currentVal = '0';
    updateDisplay();
  }

  document.addEventListener('keydown', e => {
    if ('0123456789.'.includes(e.key)) input(e.key);
    else if (e.key==='+') inputOp('+');
    else if (e.key==='-') inputOp('−');
    else if (e.key==='*') inputOp('×');
    else if (e.key==='/') inputOp('÷');
    else if (e.key==='Enter' || e.key==='=') calculate();
    else if (e.key==='Escape') clearAll();
    else if (e.key==='Backspace') backspace();
  });
</script>
</body>
</html>
